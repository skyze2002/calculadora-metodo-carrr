services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: brrrr
      POSTGRES_PASSWORD: brrrr
      POSTGRES_DB: brrrr
    ports:
      # 5433 en el host para no chocar con un Postgres local en 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brrrr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
