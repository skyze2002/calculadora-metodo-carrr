[alembic]
script_location = db/migrations
prepend_sys_path = .
# La URL real se toma de db.config.settings en env.py; este valor es de respaldo.
sqlalchemy.url = postgresql+psycopg://brrrr:brrrr@localhost:5432/brrrr

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
