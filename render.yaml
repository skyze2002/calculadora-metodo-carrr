# Blueprint de Render para el backend de la Calculadora BRRRR.
# Deploy minimo: expone el endpoint POST /deals/explain que llama a OpenAI para
# el analisis con IA. NO usa Postgres. La API key va como variable SECRETA en el
# panel de Render (sync: false), nunca en el codigo ni en la APK.

services:
  - type: web
    name: brrrr-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # La pegas vos en el panel de Render (Environment). Secreta.
      - key: OPENAI_API_KEY
        sync: false
      # Llave de app: debe coincidir con VITE_APP_KEY del frontend. La pegas vos
      # en el panel de Render (Environment). Cierra la API a extranos.
      - key: APP_KEY
        sync: false
      # Servicio de scraping para leer portales que bloquean las IPs de Render
      # (Zillow, Realtor, Redfin). Opcional: sin esta key, "Traer link" solo
      # funciona en sitios que no bloquean. Se consigue en scraperapi.com.
      - key: SCRAPER_API_KEY
        sync: false
      # Pool del scraper: "" (plan free), "premium" o "ultra". Zillow necesita
      # "ultra" (o "premium"), que requiere un plan PAGO de ScraperAPI.
      - key: SCRAPER_PREMIUM
        sync: false
      # Origenes permitidos (lista separada por comas). Incluye los de la APK
      # (WebView) y, si usas la web, agregale tu dominio de Vercel.
      - key: CORS_ORIGINS
        value: "https://localhost,capacitor://localhost,http://localhost"
